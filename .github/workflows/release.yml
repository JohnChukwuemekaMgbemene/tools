name: Publish Release

on:
  push:
    tags:
      - '*-v*'   # trigger on tags like OfficeRemover-v0.2.0

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tool name from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TOOL="${TAG%-v*}"
          VERSION="${TAG#*-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.tool }} ${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          body: |
            ## ${{ steps.meta.outputs.tool }} ${{ steps.meta.outputs.version }}

            Upload the release binaries for **${{ steps.meta.outputs.tool }}** below.

            See [`tools/${{ steps.meta.outputs.tool }}/README.md`](https://github.com/JohnChukwuemekaMgbemene/tools/blob/main/tools/${{ steps.meta.outputs.tool }}/README.md) for usage instructions.
